<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Background Gradient: Deep CTU University Blue to Midnight Navy -->
    <linearGradient id="ctuNavyBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#002D62" />
      <stop offset="45%" stop-color="#001F45" />
      <stop offset="100%" stop-color="#001024" />
    </linearGradient>

    <!-- Metallic Gold Rim Gradient -->
    <linearGradient id="goldRim" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FDE68A" />
      <stop offset="25%" stop-color="#F59E0B" />
      <stop offset="50%" stop-color="#D97706" />
      <stop offset="75%" stop-color="#FBBF24" />
      <stop offset="100%" stop-color="#92400E" />
    </linearGradient>

    <!-- Letter Face Gradient: Crisp White to Platinum -->
    <linearGradient id="letterFace" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="65%" stop-color="#F8FAFC" />
      <stop offset="100%" stop-color="#E2E8F0" />
    </linearGradient>

    <!-- Warm Gold Gradient for Accents & Bevels -->
    <linearGradient id="goldAccent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FEF08A" />
      <stop offset="30%" stop-color="#F59E0B" />
      <stop offset="100%" stop-color="#B45309" />
    </linearGradient>

    <!-- Gold Shimmer for Crossbar -->
    <linearGradient id="goldShimmer" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#D97706" />
      <stop offset="50%" stop-color="#FDE68A" />
      <stop offset="100%" stop-color="#D97706" />
    </linearGradient>

    <!-- Radial Center Glow -->
    <radialGradient id="ambientGlow" cx="50%" cy="46%" r="60%">
      <stop offset="0%" stop-color="#F59E0B" stop-opacity="0.22" />
      <stop offset="40%" stop-color="#002D62" stop-opacity="0.10" />
      <stop offset="100%" stop-color="#001024" stop-opacity="0" />
    </radialGradient>

    <!-- 3D Letter Shadow -->
    <filter id="letterDropShadow" x="-15%" y="-15%" width="130%" height="130%">
      <feDropShadow dx="0" dy="8" stdDeviation="8" flood-color="#000814" flood-opacity="0.65" />
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#000000" flood-opacity="0.4" />
    </filter>

    <filter id="starGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="4" result="glow" />
      <feComposite in="SourceGraphic" in2="glow" operator="over" />
    </filter>
  </defs>

  <!-- 1. Squircle Canvas -->
  <rect width="512" height="512" rx="116" fill="url(#ctuNavyBg)" />
  <rect width="512" height="512" rx="116" fill="url(#ambientGlow)" />

  <!-- 2. Dual Luxury Metallic Borders -->
  <rect x="10" y="10" width="492" height="492" rx="106" fill="none" stroke="url(#goldRim)" stroke-width="4.5" stroke-opacity="0.88" />
  <rect x="18" y="18" width="476" height="476" rx="98" fill="none" stroke="#FFFFFF" stroke-width="1.2" stroke-opacity="0.12" />

  <!-- 3. Architectural Watermark Geometry (Subtle Academic Compass & Tech Rings) -->
  <g opacity="0.07" stroke="#F59E0B" stroke-width="1.5" fill="none">
    <circle cx="256" cy="245" r="162" stroke-dasharray="5,6" />
    <circle cx="256" cy="245" r="198" stroke-dasharray="3,7" />
    <line x1="256" y1="36" x2="256" y2="60" />
    <line x1="256" y1="430" x2="256" y2="454" />
    <line x1="42" y1="245" x2="66" y2="245" />
    <line x1="446" y1="245" x2="470" y2="245" />
  </g>

  <!-- 4. Top Star of Excellence & Innovation -->
  <g transform="translate(256, 88)" filter="url(#starGlow)">
    <path d="M 0 -17 L 4.5 -4.5 L 17 0 L 4.5 4.5 L 0 17 L -4.5 4.5 L -17 0 L -4.5 -4.5 Z" fill="url(#goldAccent)" />
    <circle cx="0" cy="0" r="2.2" fill="#FFFFFF" />
  </g>

  <!-- 5. THE CTU LETTERMARK -->
  <g filter="url(#letterDropShadow)">

    <!-- ====== LETTER "C" ====== -->
    <!-- Base Letter C -->
    <path d="
      M 182 145
      L 128 145
      L 68 205
      L 68 285
      L 128 345
      L 182 345
      L 182 301
      L 138 301
      L 112 275
      L 112 215
      L 138 189
      L 182 189
      Z"
      fill="url(#letterFace)"
    />
    <!-- Golden Top & Bottom Chamfer Bevel on C -->
    <path d="
      M 182 145
      L 128 145
      L 68 205
      L 76 213
      L 132 157
      L 182 157
      Z"
      fill="url(#goldAccent)"
    />
    <path d="
      M 68 285
      L 128 345
      L 182 345
      L 182 333
      L 132 333
      L 76 277
      Z"
      fill="url(#goldAccent)"
    />
    <!-- Subtle Inner Gold Lining on C -->
    <path d="
      M 182 189
      L 138 189
      L 112 215
      L 112 223
      L 135 200
      L 182 200
      Z"
      fill="#D97706"
      opacity="0.6"
    />

    <!-- ====== LETTER "T" ====== -->
    <!-- T Body -->
    <path d="
      M 188 145
      L 324 145
      L 324 189
      L 278 189
      L 278 345
      L 234 345
      L 234 189
      L 188 189
      Z"
      fill="url(#letterFace)"
    />
    <!-- Golden Crossbar Upper Shelf -->
    <path d="
      M 188 145
      L 324 145
      L 324 157
      L 188 157
      Z"
      fill="url(#goldShimmer)"
    />
    <!-- Golden Center Stem Core Stripe -->
    <path d="
      M 251 157
      L 261 157
      L 261 345
      L 251 345
      Z"
      fill="url(#goldAccent)"
    />
    <!-- Golden Center Diamond Nexus -->
    <polygon points="256,137 266,147 256,157 246,147" fill="#FEF08A" />

    <!-- ====== LETTER "U" ====== -->
    <!-- Base Letter U -->
    <path d="
      M 330 145
      L 374 145
      L 374 281
      L 384 291
      L 390 291
      L 400 281
      L 400 145
      L 444 145
      L 444 291
      L 390 345
      L 384 345
      L 330 291
      Z"
      fill="url(#letterFace)"
    />
    <!-- Golden Bottom Chamfer Bevel on U -->
    <path d="
      M 444 291
      L 390 345
      L 384 345
      L 330 291
      L 338 283
      L 386 331
      L 388 331
      L 436 283
      Z"
      fill="url(#goldAccent)"
    />
    <!-- Golden Top End Caps on U -->
    <path d="
      M 330 145 L 374 145 L 374 153 L 330 153 Z
      M 400 145 L 444 145 L 444 153 L 400 153 Z"
      fill="url(#goldAccent)"
    />
  </g>

  <!-- 6. Bottom Submark: "NAGA" Capsule -->
  <g transform="translate(256, 408)">
    <!-- Pill Container -->
    <rect x="-92" y="-17" width="184" height="34" rx="17" fill="#001833" stroke="url(#goldRim)" stroke-width="1.8" />
    <!-- Lettering "NAGA" -->
    <text
      x="0"
      y="5.5"
      text-anchor="middle"
      fill="#FDE68A"
      font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Inter', 'Arial', sans-serif"
      font-size="14.5"
      font-weight="800"
      letter-spacing="5.5"
    >
      NAGA
    </text>
    <!-- Flanking Accent Diamonds -->
    <polygon points="-64,0 -68,-3.5 -72,0 -68,3.5" fill="#F59E0B" />
    <polygon points="64,0 68,-3.5 72,0 68,3.5" fill="#F59E0B" />
  </g>

  <!-- 7. Bottom Academic Horizon Arc -->
  <path d="M 175 454 Q 256 464 337 454" fill="none" stroke="url(#goldAccent)" stroke-width="2" stroke-linecap="round" opacity="0.35" />
</svg>
