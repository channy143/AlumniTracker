<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <!-- Background CTU Deep Royal Navy Gradient -->
    <linearGradient id="ctuNavy" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#003062" />
      <stop offset="100%" stop-color="#001834" />
    </linearGradient>

    <!-- Subtle Gold Edge Border -->
    <linearGradient id="ctuGoldRim" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FBBF24" stop-opacity="0.6" />
      <stop offset="100%" stop-color="#D97706" stop-opacity="0.2" />
    </linearGradient>
  </defs>

  <!-- Squircle App / Favicon Canvas -->
  <rect width="512" height="512" rx="112" fill="url(#ctuNavy)" />
  <rect x="6" y="6" width="500" height="500" rx="106" fill="none" stroke="url(#ctuGoldRim)" stroke-width="6" />

  <!-- Lower Skullcap / Collar (Crisp White with Subtle Inner Depth) -->
  <polygon points="140,240 140,310 256,380 372,310 372,240 256,290" fill="#FFFFFF" />
  <polygon points="165,270 256,325 347,270 256,290" fill="#E2E8F0" />

  <!-- Mortarboard Diamond Top -->
  <!-- Left Facet (CTU Warm Gold) -->
  <polygon points="256,120 64,210 256,280" fill="#FBBF24" />
  <!-- Right Facet (CTU Amber Gold) -->
  <polygon points="256,120 448,210 256,280" fill="#D97706" />

  <!-- Center Pivot Button -->
  <circle cx="256" cy="210" r="12" fill="#FEF3C7" />

  <!-- Flowing Golden Tassel -->
  <path d="M 256,210 C 370,195 420,230 420,295" fill="none" stroke="#FDE68A" stroke-width="7" stroke-linecap="round" />
  <circle cx="420" cy="298" r="9" fill="#FBBF24" />
  <polygon points="414,310 426,310 429,370 411,370" fill="#D97706" />
</svg>
